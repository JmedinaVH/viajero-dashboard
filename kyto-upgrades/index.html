<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Viajero · Kyto Upselling</title>
<link rel="icon" type="image/png" href="../favicon-32x32.png"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
--green:#065f46;--green-d:#044535;--green-soft:#d1fae5;--green-mid:#a7f3d0;
--cream:#F4EFE9;--cm:#EDE5DA;--cd:#E0D5C8;--border:#DDD4CA;
--dark:#1E100A;--mid:#6B3A28;--gris:#7A6E68;
--ok:#15803d;--ok-bg:#dcfce7;
--warn:#854d0e;--warn-bg:#fef9c3;
--err:#dc2626;--err-bg:#fee2e2;
--blue:#0369a1;--blue-bg:#e0f2fe;
--purple:#7c3aed;--purple-bg:#ede9fe;
--surface:#fff;
--r:14px;--rl:18px;
--sh:0 2px 8px rgba(30,16,10,.06),0 4px 20px rgba(30,16,10,.07);
--shm:0 6px 28px rgba(30,16,10,.11);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Outfit',sans-serif;background:var(--cream);color:var(--dark);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:var(--cd);border-radius:9px;}

/* HEADER — idéntico a Loyalty */
header{background:var(--dark);padding:0 36px;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.25);}
.h-left{display:flex;align-items:center;gap:14px;}
.h-logo{height:34px;object-fit:contain;}
.h-sep{width:1px;height:28px;background:rgba(255,255,255,.15);}
.h-title{color:#fff;font-size:16px;font-weight:700;}
.h-sub{color:rgba(255,255,255,.38);font-size:10px;letter-spacing:.4px;margin-top:1px;}
.h-right{display:flex;align-items:center;gap:10px;}
.h-ts{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:4px 10px;display:flex;flex-direction:column;align-items:flex-end;gap:1px;}
.h-ts-label{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:rgba(255,255,255,.3);}
.h-ts-val{font-size:11px;color:rgba(255,255,255,.6);}
.h-live{display:flex;align-items:center;gap:5px;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.25);border-radius:99px;padding:4px 11px;font-size:9px;font-weight:700;color:#10b981;letter-spacing:.5px;text-transform:uppercase;}
.h-live .dot{width:5px;height:5px;border-radius:50%;background:#10b981;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.5);}50%{box-shadow:0 0 0 4px rgba(16,185,129,0);}}
.btn-hub{display:flex;align-items:center;gap:5px;color:rgba(255,255,255,.6);font-size:11px;font-weight:600;text-decoration:none;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:5px 11px;transition:.18s;}
.btn-hub:hover{background:rgba(255,255,255,.13);color:#fff;}

/* FILTROS */
.filtros{background:var(--green);padding:9px 36px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:64px;z-index:199;border-bottom:2px solid var(--green-d);}
.fg{position:relative;}
.fg label{display:block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:rgba(255,255,255,.55);margin-bottom:3px;}
.ms-btn{font-family:'Outfit',sans-serif;font-size:12px;font-weight:600;padding:5px 24px 5px 9px;border:1.5px solid rgba(255,255,255,.22);border-radius:7px;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;min-width:140px;text-align:left;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.14s;}
.ms-btn::after{content:'▾';position:absolute;right:7px;top:50%;transform:translateY(-50%);font-size:9px;color:rgba(255,255,255,.5);}
.ms-btn:hover{background:rgba(255,255,255,.18);}
.ms-dd{display:none;position:absolute;top:calc(100% + 5px);left:0;background:var(--dark);border-radius:10px;padding:7px;min-width:220px;z-index:999;max-height:280px;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,.5);}
.ms-dd.open{display:block;}
.ms-dd-hdr{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:rgba(255,255,255,.3);padding:3px 6px 7px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:5px;display:flex;justify-content:space-between;}
.ms-dd-hdr span{cursor:pointer;color:rgba(255,255,255,.5);font-weight:600;}
.ms-dd-hdr span:hover{color:#fff;}
.ms-dd-search{width:100%;font-family:'Outfit',sans-serif;font-size:11px;padding:5px 8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:6px;color:#fff;margin-bottom:6px;outline:none;}
.ms-dd-search::placeholder{color:rgba(255,255,255,.3);}
.ms-dd label{display:flex;align-items:center;gap:7px;color:rgba(255,255,255,.82);padding:5px 7px;font-size:12px;cursor:pointer;border-radius:5px;font-weight:500;user-select:none;}
.ms-dd label:hover{background:rgba(255,255,255,.07);}
.ms-dd label.hidden{display:none;}
.ms-dd input[type=checkbox]{accent-color:var(--green-mid);width:13px;height:13px;flex-shrink:0;}
.filtros-reset{margin-left:auto;font-family:'Outfit',sans-serif;font-size:11px;font-weight:600;color:rgba(255,255,255,.55);background:none;border:1px solid rgba(255,255,255,.18);border-radius:7px;padding:4px 10px;cursor:pointer;transition:.14s;}
.filtros-reset:hover{background:rgba(255,255,255,.12);color:#fff;}

/* TABS */
.tabs-bar{background:var(--surface);border-bottom:2px solid var(--border);padding:0 36px;position:sticky;top:111px;z-index:198;display:flex;overflow-x:auto;}
.tab-btn{font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;color:var(--gris);background:none;border:none;border-bottom:3px solid transparent;padding:13px 22px;cursor:pointer;transition:.16s;margin-bottom:-2px;white-space:nowrap;}
.tab-btn:hover{color:var(--dark);}
.tab-btn.active{color:var(--green);border-bottom-color:var(--green);}
.tab-content{display:none;}
.tab-content.active{display:block;}

main{max-width:1280px;margin:0 auto;padding:26px 36px 80px;}

/* ALERT */
.alert-banner{display:flex;align-items:flex-start;gap:12px;border-radius:var(--rl);padding:14px 18px;margin-bottom:16px;}
.alert-banner.warn{background:#fff7ed;border:1.5px solid #fed7aa;}
.alert-banner.red{background:var(--err-bg);border:1.5px solid #fca5a5;}
.alert-ico{font-size:20px;flex-shrink:0;margin-top:1px;}
.alert-text{flex:1;}
.alert-title{font-size:13px;font-weight:800;color:var(--dark);margin-bottom:3px;}
.alert-desc{font-size:11px;color:var(--gris);line-height:1.6;}

/* SYNTHESIS */
.synthesis{background:var(--dark);border-radius:var(--rl);padding:20px 24px;margin-bottom:18px;position:relative;overflow:hidden;}
.synthesis::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:var(--green);opacity:.09;pointer-events:none;}
.syn-phase{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.3);margin-bottom:5px;}
.syn-headline{font-size:17px;font-weight:800;color:#fff;line-height:1.25;margin-bottom:11px;}
.syn-items{display:flex;flex-wrap:wrap;gap:7px;}
.syn-item{display:flex;align-items:flex-start;gap:7px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:8px;padding:7px 11px;font-size:11px;color:rgba(255,255,255,.62);line-height:1.5;flex:1;min-width:190px;}
.syn-item b{color:#fff;font-weight:700;}
.syn-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:3px;}
.syn-dot.ok{background:#4ade80;}.syn-dot.warn{background:#fbbf24;}.syn-dot.err{background:#f87171;}.syn-dot.info{background:#60a5fa;}

/* CONCLUSIONES */
.conclusiones{background:linear-gradient(135deg,#0c3326 0%,#155234 100%);border-radius:var(--rl);padding:20px 24px;margin-bottom:22px;}
.conc-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.38);margin-bottom:10px;}
.conc-list{display:flex;flex-direction:column;gap:8px;}
.conc-item{display:flex;align-items:flex-start;gap:9px;font-size:12px;color:rgba(255,255,255,.72);line-height:1.6;}
.conc-item b{color:#fff;font-weight:700;}
.conc-ico{font-size:14px;flex-shrink:0;margin-top:1px;}

/* METODOLOGÍA */
.metodo-banner{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--rl);padding:16px 20px;margin-bottom:22px;}
.metodo-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--gris);margin-bottom:11px;display:flex;align-items:center;gap:6px;}
.metodo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.metodo-card{border-radius:10px;padding:13px 15px;border:1.5px solid;}
.metodo-card.op{background:#f0fdf9;border-color:#a7f3d0;}
.metodo-card.hostal{background:#fefce8;border-color:#fde68a;}
.metodo-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.metodo-name{font-size:12px;font-weight:800;color:var(--dark);}
.metodo-tag{font-size:8px;font-weight:700;padding:2px 8px;border-radius:99px;}
.tag-live{background:#dcfce7;color:#15803d;}
.tag-cerr{background:#fef9c3;color:#854d0e;}
.metodo-formula{font-size:10px;font-weight:700;font-family:monospace;background:rgba(0,0,0,.06);padding:2px 8px;border-radius:5px;display:inline-block;margin-bottom:6px;color:var(--dark);}
.metodo-desc{font-size:10px;color:var(--gris);line-height:1.65;}
.metodo-desc b{color:var(--dark);}
.metodo-nota{font-size:9px;color:var(--gris);margin-top:9px;padding:6px 10px;background:var(--cm);border-radius:7px;line-height:1.6;}
@media(max-width:640px){.metodo-grid{grid-template-columns:1fr;}}

/* HERO */
.hero-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
.hero-kpi{background:var(--surface);border-radius:var(--rl);padding:20px 18px;border:1.5px solid var(--border);position:relative;overflow:hidden;transition:box-shadow .18s,transform .18s;}
.hero-kpi:hover{box-shadow:var(--shm);transform:translateY(-2px);}
.hero-kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--hc,var(--green));border-radius:var(--rl) var(--rl) 0 0;}
.hero-glow{position:absolute;bottom:-18px;right:-18px;width:72px;height:72px;border-radius:50%;background:var(--hc,var(--green));opacity:.06;}
.hero-label{font-size:10px;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px;}
.hero-val{font-size:32px;font-weight:800;line-height:1;color:var(--hc,var(--dark));margin-bottom:5px;}
.hero-sub{font-size:11px;color:var(--gris);line-height:1.4;}
.hero-delta{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;margin-top:5px;padding:2px 8px;border-radius:99px;}
.hero-delta.up{background:#dcfce7;color:#15803d;}
.hero-delta.down{background:var(--err-bg);color:var(--err);}
.hero-delta.neutral{background:var(--cm);color:var(--gris);}

/* SEC */
.sec{margin-bottom:24px;}
.sec-hdr{display:flex;align-items:center;gap:9px;margin-bottom:13px;}
.sec-hdr h2{font-size:11px;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:1px;white-space:nowrap;}
.sec-hdr .linea{flex:1;height:1px;background:var(--border);}

/* GAUGE TABLE — Conversión vs hostal (escala para 30+ hosteles) */
.gauge-table-wrap{background:var(--surface);border-radius:var(--rl);border:1.5px solid var(--border);overflow:hidden;}
.gauge-table{width:100%;border-collapse:collapse;font-size:12px;}
.gauge-table thead th{background:var(--cm);color:var(--mid);padding:9px 14px;font-weight:700;font-size:9px;text-transform:uppercase;letter-spacing:.6px;border-bottom:1.5px solid var(--border);text-align:left;white-space:nowrap;cursor:pointer;user-select:none;transition:.14s;}
.gauge-table thead th:hover{background:var(--cd);color:var(--dark);}
.gauge-table thead th.sorted{color:var(--green);}
.gauge-table thead th .sort-ico{margin-left:4px;opacity:.4;font-size:8px;}
.gauge-table thead th.sorted .sort-ico{opacity:1;}
.gauge-table tbody td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
.gauge-table tbody tr:last-child td{border-bottom:none;}
.gauge-table tbody tr:hover td{background:var(--cream);}
.gt-prop{font-size:12px;font-weight:800;color:var(--dark);}
.gt-prop-sub{font-size:10px;color:var(--gris);font-weight:500;margin-top:1px;}
.gt-bar-wrap{display:flex;align-items:center;gap:8px;}
.gt-bar-track{flex:1;min-width:80px;height:7px;background:var(--cd);border-radius:99px;overflow:hidden;}
.gt-bar-fill{height:100%;border-radius:99px;transition:width .6s;}
.gt-pct{font-size:13px;font-weight:800;min-width:48px;text-align:right;}
.gt-denom{font-size:10px;color:var(--gris);}
.gt-cum{font-size:12px;font-weight:700;color:var(--dark);}
.gt-tipo-ico{font-size:13px;}

/* REVENUE */
.rev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;}
.rev-card{background:var(--surface);border-radius:var(--rl);border:1.5px solid var(--border);padding:18px 16px;}
.rev-amount{font-size:26px;font-weight:800;color:var(--green);margin:6px 0 4px;}
.rev-label{font-size:10px;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:.5px;}
.rev-sub{font-size:11px;color:var(--gris);}
.rev-ticket{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;background:var(--green-soft);color:var(--ok);padding:2px 8px;border-radius:99px;margin-top:6px;}

/* TREND */
.trend-wrap{background:var(--surface);border-radius:var(--rl);border:1.5px solid var(--border);overflow:hidden;}
.trend-table{width:100%;border-collapse:collapse;font-size:12px;}
.trend-table thead th{background:var(--cm);color:var(--mid);padding:9px 13px;font-weight:700;font-size:9px;text-transform:uppercase;letter-spacing:.6px;border-bottom:1.5px solid var(--border);text-align:left;}
.trend-table tbody td{padding:11px 13px;border-bottom:1px solid var(--border);vertical-align:middle;}
.trend-table tbody tr:last-child td{border-bottom:none;}
.trend-table tbody tr:hover td{background:var(--cream);}
.delta-up{color:var(--ok);font-weight:700;font-size:11px;}
.delta-down{color:var(--err);font-weight:700;font-size:11px;}

/* PROP CARDS */
.prop-search{width:100%;max-width:380px;font-family:'Outfit',sans-serif;font-size:12px;padding:8px 12px;background:var(--surface);border:1.5px solid var(--border);border-radius:9px;outline:none;color:var(--dark);margin-bottom:13px;transition:.15s;display:block;}
.prop-search:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(6,95,70,.1);}
.prop-grid{display:flex;flex-direction:column;gap:11px;}
.prop-card{background:var(--surface);border-radius:var(--rl);border:1.5px solid var(--border);overflow:hidden;transition:.16s;}
.prop-card:hover{box-shadow:var(--shm);}
.prop-card.hidden{display:none;}
.prop-card-head{display:flex;align-items:center;gap:14px;padding:15px 20px;cursor:pointer;}
.prop-card-head.critico{border-left:4px solid var(--err);}
.prop-card-head.bueno{border-left:4px solid var(--ok);}
.prop-card-head.medio{border-left:4px solid #eab308;}
.prop-ico{font-size:20px;flex-shrink:0;}
.prop-info{flex:1;}
.prop-name{font-size:14px;font-weight:800;color:var(--dark);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.prop-sub{font-size:11px;color:var(--gris);margin-top:2px;}
.prop-metrics{display:flex;gap:16px;align-items:center;flex-shrink:0;}
.prop-m{text-align:center;}
.prop-m-val{font-size:17px;font-weight:800;line-height:1;}
.prop-m-lbl{font-size:8px;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:.4px;margin-top:2px;}
.prop-arr{font-size:10px;color:var(--gris);transition:transform .2s;margin-left:4px;}
.prop-card-head.open .prop-arr{transform:rotate(180deg);}
.prop-body{display:none;padding:14px 20px 18px;border-top:1px solid var(--border);}
.prop-body.vis{display:block;}

/* TIPO CARDS dentro de prop */
.tipo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.tipo-card{border-radius:11px;padding:14px;border:1.5px solid var(--border);background:var(--cream);}
.tipo-card.desayuno{border-color:#a7f3d0;background:#f0fdf9;}
.tipo-card.upgrade{border-color:#bfdbfe;background:#eff6ff;}
.tipo-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:7px;}
.tipo-name{font-size:12px;font-weight:800;display:flex;align-items:center;gap:5px;}
.tipo-conv-wrap{text-align:right;}
.tipo-conv{font-size:21px;font-weight:800;line-height:1;}
.tipo-conv.ok{color:var(--ok);}.tipo-conv.warn{color:#854d0e;}.tipo-conv.err{color:var(--err);}
.tipo-conv-lbl{font-size:8px;color:var(--gris);margin-top:1px;}
/* HOW pill dentro de tipo card */
.tipo-how{font-size:9px;font-weight:600;color:var(--gris);background:rgba(0,0,0,.04);border-radius:6px;padding:4px 8px;margin-bottom:8px;line-height:1.55;}
.tipo-how strong{color:var(--dark);font-weight:800;}
.tipo-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:10px;color:var(--gris);}
.tipo-bar-track{flex:1;height:6px;background:var(--cd);border-radius:99px;overflow:hidden;}
.tipo-bar-fill{height:100%;border-radius:99px;transition:width .6s;}
.tipo-rev{font-size:11px;color:var(--gris);margin-top:5px;}
.tipo-channel{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap;}
.tipo-ch{font-size:9px;font-weight:700;padding:2px 8px;border-radius:99px;}
.ch-wa{background:#dcfce7;color:#15803d;}
.ch-email{background:var(--blue-bg);color:var(--blue);}
.ch-sin{background:var(--cm);color:var(--gris);}

/* TIMING — barras horizontales */
.timing-wrap{background:var(--surface);border-radius:var(--rl);border:1.5px solid var(--border);padding:22px 24px;}
.t-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.t-title{font-size:14px;font-weight:800;color:var(--dark);}
.t-subtitle{font-size:11px;color:var(--gris);margin-top:3px;}
.t-best-badge{background:var(--green-soft);color:var(--ok);font-size:10px;font-weight:700;padding:4px 12px;border-radius:99px;border:1px solid var(--green-mid);white-space:nowrap;}
.t-slot{margin-bottom:10px;}
.t-slot-lbl{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;}
.t-slot-name{font-size:12px;font-weight:800;color:var(--dark);min-width:36px;}
.t-slot-total{font-size:11px;color:var(--gris);font-weight:600;}
.t-hbar-row{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
.t-hbar-tipo{font-size:9px;font-weight:700;color:var(--gris);min-width:62px;text-align:right;}
.t-hbar-track{flex:1;height:11px;background:var(--cd);border-radius:99px;overflow:hidden;}
.t-hbar-fill{height:100%;border-radius:99px;transition:width .6s;}
.t-hbar-val{font-size:10px;font-weight:700;min-width:22px;text-align:left;color:var(--dark);}
.t-divider{height:1px;background:var(--border);margin:12px 0;}
.t-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:10px;color:var(--gris);padding-top:12px;margin-top:4px;border-top:1px solid var(--cd);}
.t-legend span{display:flex;align-items:center;gap:5px;}

/* CANAL */
.canal-wrap{background:var(--surface);border-radius:var(--rl);border:1.5px solid var(--border);overflow:hidden;}
.canal-table{width:100%;border-collapse:collapse;font-size:12px;}
.canal-table th{background:var(--cm);color:var(--mid);padding:9px 14px;font-weight:700;font-size:9px;text-transform:uppercase;letter-spacing:.6px;border-bottom:1.5px solid var(--border);text-align:left;}
.canal-table td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
.canal-table tr:last-child td{border-bottom:none;}
.canal-table tr:hover td{background:var(--cream);}
.bar-duo{height:7px;background:var(--cd);border-radius:99px;overflow:hidden;display:flex;}

/* BADGES */
.badge{display:inline-flex;align-items:center;font-size:9px;font-weight:700;padding:2px 7px;border-radius:99px;}
.b-ok{background:var(--ok-bg);color:var(--ok);}
.b-warn{background:var(--warn-bg);color:var(--warn);}
.b-err{background:var(--err-bg);color:var(--err);}
.b-blue{background:var(--blue-bg);color:var(--blue);}
.b-gray{background:var(--cd);color:var(--mid);}
.b-curso{background:#fef3c7;color:#92400e;}

/* INFO */
.ib{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--cm);color:var(--gris);font-size:8px;font-weight:800;cursor:pointer;border:1px solid var(--border);transition:.14s;font-style:normal;flex-shrink:0;vertical-align:middle;margin-left:3px;}
.ib:hover{background:var(--green);color:#fff;border-color:var(--green);}
.empty{text-align:center;padding:28px;color:var(--gris);font-size:12px;}

/* OVERLAY */
#tip-overlay{display:none;position:fixed;inset:0;z-index:9000;background:rgba(15,8,4,.55);align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);}
#tip-overlay.show{display:flex;}
#tip-box{background:#fff;border-radius:14px;max-width:440px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(30,16,10,.2);position:relative;animation:popIn .17s;}
@keyframes popIn{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
#tip-box h4{font-size:15px;font-weight:800;margin-bottom:8px;}
#tip-box p{font-size:12px;color:var(--gris);line-height:1.8;white-space:pre-line;}
#tip-close{position:absolute;top:12px;right:13px;font-size:20px;cursor:pointer;color:var(--gris);background:none;border:none;}

@media(max-width:960px){.hero-grid{grid-template-columns:1fr 1fr;}.tipo-grid{grid-template-columns:1fr;}}
@media(max-width:640px){
header,.filtros,.tabs-bar{padding-left:14px;padding-right:14px;}
main{padding:14px 14px 60px;}
.hero-grid{grid-template-columns:1fr 1fr;}
.tab-btn{font-size:11px;padding:10px 12px;}
.prop-metrics{display:none;}
.gauge-row{grid-template-columns:1fr;}
}
@media(max-width:420px){.hero-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>

<div id="tip-overlay" onclick="closeTip(event)">
<div id="tip-box"><button id="tip-close" onclick="closeTip()">×</button><h4 id="tip-title"></h4><p id="tip-body"></p></div>
</div>

<header>
<div class="h-left">
<img class="h-logo" src="../02_Logo-Viajero_Vertical-Blanco.png" alt="Viajero" onerror="this.style.display='none'"/>
<div class="h-sep"></div>
<div><div class="h-title">Kyto Upselling</div><div class="h-sub">Viajero Hostels · Upselling pre check-in</div></div>
</div>
<div class="h-right">
<div class="h-ts"><div class="h-ts-label">Última actualización</div><div class="h-ts-val" id="h-ts">—</div></div>
<div class="h-live"><div class="dot"></div>Live</div>
<a href="../index.html" class="btn-hub">← Hub</a>
</div>
</header>

<div class="filtros">
<div class="fg"><label>Período</label><div class="ms-wrap"><button class="ms-btn" onclick="toggleMs('per')" id="ms-per-btn">Todos</button><div class="ms-dd" id="ms-per-dd"><div class="ms-dd-hdr">Períodos <span onclick="clearMs('per')">Limpiar</span></div></div></div></div>
<div class="fg"><label>Propiedad</label><div class="ms-wrap"><button class="ms-btn" onclick="toggleMs('prop')" id="ms-prop-btn">Todas</button><div class="ms-dd" id="ms-prop-dd"><div class="ms-dd-hdr">Propiedades <span onclick="clearMs('prop')">Limpiar</span></div><input class="ms-dd-search" type="text" placeholder="Buscar hostal..." oninput="filterDdItems('prop',this.value)"/></div></div></div>
<div class="fg"><label>Tipo oferta</label><div class="ms-wrap"><button class="ms-btn" onclick="toggleMs('tipo')" id="ms-tipo-btn">Todos</button><div class="ms-dd" id="ms-tipo-dd"><div class="ms-dd-hdr">Tipo <span onclick="clearMs('tipo')">Limpiar</span></div></div></div></div>
<button class="filtros-reset" onclick="resetFiltros()">× Limpiar todo</button>
</div>

<button class="tab-btn" onclick="switchTab('propiedades',this)">Por propiedad</button>
<button class="tab-btn" onclick="switchTab('timing',this)">Timing & Canal</button>
</div>

<main>
<!-- TAB 1 -->
<div id="tab-resumen" class="tab-content active">
<div id="alerts-wrap"></div>
<div class="sec"><div id="hero-kpis"></div></div>
<div id="synthesis-sec"></div>
<div id="conclusiones-sec"></div>

<div id="gauge-sec"></div>
</div>

<div class="sec">
<div class="sec-hdr"><h2>Tendencia por período <i class="ib" onclick="openTip('tendencia')">i</i></h2><div class="linea"></div></div>
<div id="trend-sec"></div>
</div>
<div id="metodo-sec"></div>
</div>

<div id="tab-propiedades" class="tab-content">

<div class="sec-hdr"><h2>Detalle por propiedad & tipo</h2><div class="linea"></div></div>
<input class="prop-search" type="text" placeholder="🔍  Buscar propiedad... (preparado para 30 hostales)" oninput="filterPropCards(this.value)"/>
<div class="prop-grid" id="prop-grid"></div>
</div>

<div id="timing-sec"></div>
</div>

<script>
var DATA=null;
var TIPS={
'conv_hostal':{
t:'Conversión vs universo real',
b:'¿Qué lee esta métrica?\n\n🍳 Desayuno = cumplidas ÷ total huéspedes del hostal\n🛏️ Upgrade = cumplidas ÷ total check-ins del hostal\n\n¿Por qué es la más honesta?\nElimina el sesgo de cuántas ofertas decidimos enviar. Mide qué % del universo total realmente compró.\n\nSolo disponible para períodos cerrados (denominador definitivo).\n\nReferencia de color:\n🟢 Verde = ≥ 1% · 🟡 Amarillo = 0.5-1% · 🔴 Rojo = < 0.5%\n\nEjemplo: 0.15% en hostal con 1,000 check-ins = 1-2 upgrades. Objetivo a mediano plazo: llegar al 1-2% sostenido con los 30 hostales.'
},
'tendencia':{
t:'Tendencia por período',
b:'Compara el rendimiento entre períodos.\n↑ Subió vs anterior · ↓ Bajó vs anterior\n\nCada período = mes de check-in del huésped.\nMayo aparece como "En curso" — datos parciales: solo incluye los check-ins del mes que ya ocurrieron.\n\nConv % columna = conv. operativa (cumplidas ÷ enviadas).\nConv % vs hostal solo se muestra en la sección de gauges cuando el mes está cerrado.'
},
'timing':{
t:'¿Cuándo acepta el huésped?',
b:'Qué muestra este gráfico (súper literal):\n\nCuenta cuántas ofertas fueron ACEPTADAS en cada franja de tiempo, comparando:\n(Fecha de aceptación) vs (Fecha de check-in)\n\nCómo leer T:\nT-3 = aceptó 3 días ANTES del check-in\nT-2 = aceptó 2 días ANTES del check-in\nT-1 = aceptó 1 día ANTES del check-in\nT-0 = aceptó el MISMO día del check-in\nT+1 = aceptó 1 día DESPUÉS (ya estaba hospedado)\n\nColores:\n🍳 Verde = Desayuno · 🛏️ Azul = Upgrade\n\nImportante (escala):\nLas barras son RELATIVAS al máximo del filtro actual.\nSirven para comparar qué franja domina (no para comparar entre meses si cambias el filtro).\n\nCómo usarlo:\nSi domina T-2/T-1 → buen timing pre check-in.\nSi domina T+1 → oportunidad de empujar upsell durante la estadía.'
},
'canal':{
t:'Canal de aceptación',
b:'Muestra si la oferta fue aceptada por WhatsApp o Email.\n\nCada propiedad puede tener un canal dominante distinto.\n\nSi WhatsApp domina → invertir en plantillas y timing de WA.\nSi Email domina → asunto y diseño del email son clave.'
}
};
function openTip(k){var t=TIPS[k];if(!t)return;document.getElementById('tip-title').textContent=t.t;document.getElementById('tip-body').textContent=t.b;document.getElementById('tip-overlay').classList.add('show');}
function openTipCustom(title,body){
document.getElementById('tip-title').textContent=title;
document.getElementById('tip-body').textContent=body;
document.getElementById('tip-overlay').classList.add('show');
}
function closeTip(e){if(e&&e.target!==document.getElementById('tip-overlay')&&e.target!==document.getElementById('tip-close'))return;document.getElementById('tip-overlay').classList.remove('show');}
document.addEventListener('keydown',function(e){if(e.key==='Escape')document.getElementById('tip-overlay').classList.remove('show');});

function switchTab(id,btn){
document.querySelectorAll('.tab-content').forEach(function(t){t.classList.remove('active');});
document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
document.getElementById('tab-'+id).classList.add('active');btn.classList.add('active');
}

function toggleMs(id){
var dd=document.getElementById('ms-'+id+'-dd');
document.querySelectorAll('.ms-dd').forEach(function(d){if(d!==dd)d.classList.remove('open');});
dd.classList.toggle('open');
}
document.addEventListener('click',function(e){
if(!e.target.closest('.ms-wrap'))document.querySelectorAll('.ms-dd').forEach(function(d){d.classList.remove('open');});
});
function getMsValues(id){
return Array.from(document.querySelectorAll('#ms-'+id+'-dd input[type=checkbox]:checked')||[]).map(function(c){return c.value;});
}
function clearMs(id){
document.querySelectorAll('#ms-'+id+'-dd input[type=checkbox]').forEach(function(c){c.checked=false;});
updateMsBtn(id);render();
}
function resetFiltros(){['per','prop','tipo'].forEach(clearMs);}
function updateMsBtn(id){
var vals=getMsValues(id),btn=document.getElementById('ms-'+id+'-btn');
var labels={per:'Todos',prop:'Todas',tipo:'Todos'};
btn.textContent=vals.length===0?labels[id]:vals.length===1?vals[0]:vals.length+' seleccionados';
}
function filterDdItems(id,q){
Array.from(document.querySelectorAll('#ms-'+id+'-dd label')).forEach(function(l){
if(!l.querySelector('input'))return;
l.classList.toggle('hidden',q.length>0&&!l.textContent.toLowerCase().includes(q.toLowerCase()));
});
}
function filterPropCards(q){
document.querySelectorAll('.prop-card[data-prop]').forEach(function(c){
c.classList.toggle('hidden',q.length>0&&!c.dataset.prop.toLowerCase().includes(q.toLowerCase()));
});
}
function poblarFiltros(){
var det=DATA.detalle||[];
function fill(id,vals){
var dd=document.getElementById('ms-'+id+'-dd');
while(dd.children.length>1)dd.removeChild(dd.lastChild);
vals.forEach(function(v){
var lbl=document.createElement('label');
var cb=document.createElement('input');cb.type='checkbox';cb.value=v;
cb.addEventListener('change',function(){updateMsBtn(id);render();});
lbl.appendChild(cb);lbl.appendChild(document.createTextNode(' '+v));dd.appendChild(lbl);
});
}
var pS=[],prS=[],tS=[];
det.forEach(function(r){
if(r.Período&&!pS.includes(r.Período))pS.push(r.Período);
if(r.Propiedad&&!prS.includes(r.Propiedad))prS.push(r.Propiedad);
if(r.tipo&&!tS.includes(r.tipo))tS.push(r.tipo);
});
fill('per',pS.sort());fill('prop',prS.sort());fill('tipo',tS.sort());
}
function filtrar(arr){
var p=getMsValues('per'),pr=getMsValues('prop'),ti=getMsValues('tipo');
return arr.filter(function(r){
return(!p.length||p.includes(r.Período||''))&&(!pr.length||pr.includes(r.Propiedad||''))&&(!ti.length||ti.includes(r.tipo||''));
});
}

// ─── FORMATO ───────────────────────────────────────────────────────────────
function fmtN(n){return Math.round(Number(n)||0).toLocaleString('es-CO');}
function fmtUSD(n){return '$'+(Math.round((Number(n)||0)*100)/100).toLocaleString('es-CO',{minimumFractionDigits:2,maximumFractionDigits:2});}

// FIX CLAVE: conv_vs_hostal_pct viene como fracción pura (0.0011 = 0.11%)
// fmtFrac multiplica x100 una sola vez
function fmtFrac(f,dec){
var d=dec==null?2:dec;
var v=Math.round(f*100*Math.pow(10,d))/Math.pow(10,d);
return v.toFixed(d)+'%';
}
// Para conv_oferta_pct también viene como fracción (0.0763 = 7.63%)
function fmtOferta(f,dec){return fmtFrac(f,dec==null?1:dec);}

function colOferta(f){return f>=0.12?'var(--ok)':f>=0.06?'#ca8a04':'var(--err)';}
function clsOferta(f){return f>=0.12?'ok':f>=0.06?'warn':'err';}
// Hostal: escala distinta — objetivo largo plazo 1-2% (0.01-0.02)
function colHostal(f){return f>=0.01?'var(--ok)':f>=0.005?'#ca8a04':'var(--err)';}

// ─── METODOLOGÍA ──────────────────────────────────────────────────────────
function renderMetodo(res){
var cerrados=res.filter(function(r){return r.cerrado;}).map(function(r){return r.Período;});
var abiertos=res.filter(function(r){return !r.cerrado;}).map(function(r){return r.Período;});
document.getElementById('metodo-sec').innerHTML=
'<details class="metodo-banner">'+
'<summary class="metodo-title">📐 ¿Cómo medimos? <span style="margin-left:auto;color:var(--gris);font-weight:700">▾</span></summary>'+
'<div class="metodo-grid">'+
'<div class="metodo-card op">'+
'<div class="metodo-head"><span class="metodo-name">⚡ Conv % operativa</span><span class="metodo-tag tag-live">Tiempo real</span></div>'+
'<div class="metodo-formula">cumplidas ÷ enviadas</div>'+
'<div class="metodo-desc"><b>Período = mes de envío</b> (derivado de <i>Fecha creada</i> en <b>07_Kyto_Upselling_Raw</b>). Disponible siempre, incluso con el mes en curso.<br><br>Responde: <b>¿Qué % de las ofertas enviadas fue aceptado?</b><br><br>💡 Si el mes está “En curso”, las cifras son parciales pero reales.</div>'+
'</div>'+
'<div class="metodo-card hostal">'+
'<div class="metodo-head"><span class="metodo-name">🏨 Conv % vs hostal</span><span class="metodo-tag tag-cerr">Solo mes cerrado</span></div>'+
'<div class="metodo-formula">cumplidas ÷ universo hostal</div>'+
'<div class="metodo-desc">Denominador desde <b>06_Kyto_Denominadores</b>, disponible solo cuando <b>Cerrado = TRUE</b>.<br>🍳 Desayuno: ÷ huéspedes totales · 🛏️ Upgrade: ÷ check-ins totales<br><br>Elimina el sesgo de cuántas ofertas enviamos. Mide el % real del universo que compró.<br><br>Responde: <b>¿Qué % de todos los huéspedes del hostal compró?</b><br><br>'+
(cerrados.length?'<span style="color:var(--ok);font-weight:700">✅ Cerrado'+(cerrados.length>1?'s':'')+': '+cerrados.join(', ')+'</span><br>':'')+
(abiertos.length?'<span style="color:var(--warn);font-weight:700">⏳ En curso: '+abiertos.join(', ')+' — se calcula al cerrar el mes</span>':'')+
'</div>'+
'</div>'+
'</div>'+
'<div class="metodo-nota">ℹ️ Para cerrar un mes: completar check-ins y huéspedes en <b>06_Kyto_Denominadores</b>, marcar <b>Cerrado = TRUE</b> y correr el AppScript.</div>'+
'</details>';
}

// ─── ALERTAS ───────────────────────────────────────────────────────────────
function renderAlerts(det){
var html='';
det.filter(function(r){return r.tipo==='Upgrade'&&r.ofertas_cumplidas===0&&r.ofertas_enviadas>5;}).forEach(function(r){
html+='<div class="alert-banner red"><div class="alert-ico">⚠️</div><div class="alert-text">'+
'<div class="alert-title">'+r.Propiedad+' · Upgrade sin conversiones en '+r.Período+'</div>'+
'<div class="alert-desc">'+r.ofertas_enviadas+' ofertas enviadas · 0 cumplidas. Revisar mensaje, precio del upgrade y canal utilizado.</div>'+
'</div></div>';
});
document.getElementById('alerts-wrap').innerHTML=html;
}

// ─── SYNTHESIS ─────────────────────────────────────────────────────────────
function renderSynthesis(det,res){
var totEnv=det.reduce(function(s,r){return s+r.ofertas_enviadas;},0);
var totCum=det.reduce(function(s,r){return s+r.ofertas_cumplidas;},0);
var totRev=det.reduce(function(s,r){return s+r.revenue_usd;},0);
var conv=totEnv>0?totCum/totEnv:0;
var ticket=totCum>0?totRev/totCum:0;
var pCerrados=res.filter(function(r){return r.cerrado;}).length;
var hl=conv>=0.12?'Programa con buena conversión — '+fmtOferta(conv)+' de ofertas aceptadas':
conv>=0.06?'Conversión en crecimiento — '+fmtOferta(conv)+' de ofertas aceptadas':
'Programa en fase inicial — '+fmtOferta(conv)+' de conversión global';
var nProps=[...new Set(det.map(function(r){return r.Propiedad;}))].length;
var items=[
{dot:conv>=0.1?'ok':conv>=0.06?'warn':'err',h:'<b>'+totCum+'</b> ofertas cumplidas de <b>'+totEnv+'</b> enviadas · conv. global '+fmtOferta(conv)},
{dot:'ok',h:'<b>'+fmtUSD(totRev)+'</b> generados · ticket promedio <b>'+fmtUSD(ticket)+'</b> por venta'},
{dot:'info',h:'<b>'+nProps+'</b> propiedad'+(nProps!==1?'es':'')+' activa'+(nProps!==1?'s':'')+' · <b>'+pCerrados+'</b> período'+(pCerrados!==1?'s':'')+' cerrado'+(pCerrados!==1?'s':'')}
];
var cero=det.filter(function(r){return r.tipo==='Upgrade'&&r.ofertas_cumplidas===0&&r.ofertas_enviadas>5;});
if(cero.length)items.push({dot:'err',h:'<b>'+cero.length+'</b> caso'+(cero.length!==1?'s':'')+' con 0% en Upgrade — requieren atención'});
var periodos=[...new Set(det.map(function(r){return r.Período;}))].sort().join(', ');
document.getElementById('synthesis-sec').innerHTML=
'<div class="synthesis"><div class="syn-phase">📍 Upselling pre check-in · Kyto · '+periodos+'</div>'+
'<div class="syn-headline">'+hl+'</div>'+
'<div class="syn-items">'+items.map(function(it){
return '<div class="syn-item"><div class="syn-dot '+it.dot+'"></div><span>'+it.h+'</span></div>';
}).join('')+'</div></div>';
}

// ─── CONCLUSIONES AUTOMÁTICAS ──────────────────────────────────────────────
function renderConclusiones(det,res){
var ins=[];
// mejor propiedad
var propStats=[...new Set(det.map(function(r){return r.Propiedad;}))].map(function(p){
var rw=det.filter(function(r){return r.Propiedad===p;});
var e=rw.reduce(function(s,r){return s+r.ofertas_enviadas;},0);
var c=rw.reduce(function(s,r){return s+r.ofertas_cumplidas;},0);
var rv=rw.reduce(function(s,r){return s+r.revenue_usd;},0);
return{name:p,e:e,c:c,rv:rv,conv:e>0?c/e:0};
});
var sorted=propStats.slice().sort(function(a,b){return b.conv-a.conv;});
if(sorted.length)ins.push({ico:'🏆',txt:'<b>'+sorted[0].name.replace('Viajero ','')+'</b> lidera la conversión con <b>'+fmtOferta(sorted[0].conv)+'</b> de sus ofertas aceptadas.'});
// canal dominante
var waT=det.reduce(function(s,r){return s+r.canal_wa_cumplidas;},0);
var emT=det.reduce(function(s,r){return s+r.canal_email_cumplidas;},0);
if(waT+emT>0)ins.push({ico:waT>=emT?'📱':'📧',txt:'El canal dominante es <b>'+(waT>=emT?'WhatsApp':'Email')+'</b> con <b>'+Math.round(Math.max(waT,emT)/(waT+emT)*100)+'%</b> de las conversiones. Enfocar contenido y timing en ese canal.'});
// tendencia
var cerr=res.filter(function(r){return r.cerrado;}).sort(function(a,b){return a.Período.localeCompare(b.Período);});
if(cerr.length>=2){
var l=cerr[cerr.length-1],pv=cerr[cerr.length-2],diff=l.conv_oferta_pct-pv.conv_oferta_pct;
if(Math.abs(diff)>0.005)ins.push({ico:diff>0?'📈':'📉',txt:'Conversión <b>'+(diff>0?'subió':'bajó')+'</b> de '+fmtOferta(pv.conv_oferta_pct)+' ('+pv.Período+') a <b>'+fmtOferta(l.conv_oferta_pct)+'</b> ('+l.Período+'). '+(diff>0?'Mantener la estrategia.':'Revisar qué cambió.')});
}
// zero upgrades
var cero=det.filter(function(r){return r.tipo==='Upgrade'&&r.ofertas_cumplidas===0&&r.ofertas_enviadas>5;});
if(cero.length)ins.push({ico:'🔎',txt:cero.map(function(r){return r.Propiedad.replace('Viajero ','');}).join(', ')+': <b>0 conversiones en Upgrade</b>. Probar A/B test de asunto o ajustar precio del upgrade ofertado.'});
// proyección 30 hostales
var totE=propStats.reduce(function(s,p){return s+p.e;},0);
var totC=propStats.reduce(function(s,p){return s+p.c;},0);
var convG=totE>0?totC/totE:0;
var proyVentas=Math.round(30*(totE/Math.max(propStats.length,1))*convG);
var proyRev=fmtUSD(30*(propStats.reduce(function(s,p){return s+p.rv;},0)/Math.max(propStats.length,1)));
ins.push({ico:'🏗️',txt:'Con los <b>30 hostales</b> de la cadena y la tasa actual de <b>'+fmtOferta(convG)+'</b>, el potencial mensual proyectado sería <b>~'+fmtN(proyVentas)+' ventas</b> y <b>~'+proyRev+'</b> en revenue de Kyto Upgrades.'});
document.getElementById('conclusiones-sec').innerHTML=
'<div class="conclusiones"><div class="conc-title">💡 Conclusiones automáticas</div>'+
'<div class="conc-list">'+ins.map(function(it){
return '<div class="conc-item"><div class="conc-ico">'+it.ico+'</div><div>'+it.txt+'</div></div>';
}).join('')+'</div></div>';
}

// ─── HERO KPIs ─────────────────────────────────────────────────────────────
function renderHero(det,res){
var totEnv=det.reduce(function(s,r){return s+r.ofertas_enviadas;},0);
var totCum=det.reduce(function(s,r){return s+r.ofertas_cumplidas;},0);
var totRev=det.reduce(function(s,r){return s+r.revenue_usd;},0);
var conv=totEnv>0?totCum/totEnv:0;
var ticket=totCum>0?totRev/totCum:0;

// breakdown por tipo para detalle
var byTipo={};
det.forEach(function(r){
if(!byTipo[r.tipo])byTipo[r.tipo]={rev:0,cum:0};
byTipo[r.tipo].rev+=r.revenue_usd;byTipo[r.tipo].cum+=r.ofertas_cumplidas;
});

var fp=getMsValues('per'),prev=null;
if(fp.length===1){
var allP=res.map(function(r){return r.Período;}).sort();
var idx=allP.indexOf(fp[0]);
if(idx>0)prev=res.find(function(r){return r.Período===allP[idx-1];});
}
function dlta(curr,pv,fmt){
if(!prev||pv==null)return '';
var d=curr-pv;
if(Math.abs(d)<0.0001)return '<span class="hero-delta neutral">—</span>';
return '<span class="hero-delta '+(d>0?'up':'down')+'">'+(d>0?'↑':'↓')+' '+fmt(Math.abs(d))+'</span>';
}

var items=[
{l:'Ofertas enviadas',v:fmtN(totEnv),s:totCum+' cumplidas',hc:'var(--green)',d:dlta(totEnv,prev?prev.ofertas_enviadas:null,fmtN)},
{l:'Conversión global',v:fmtOferta(conv),s:'cumplidas ÷ enviadas · por mes de check-in',hc:colOferta(conv),d:dlta(conv,prev?prev.conv_oferta_pct:null,function(x){return fmtOferta(x,2);})},
{l:'Revenue generado',v:fmtUSD(totRev),s:totCum+' ventas · '+fmtUSD(ticket)+' ticket',hc:'#0369a1',d:dlta(totRev,prev?prev.revenue_usd:null,fmtUSD),id:'hero-rev'},
{l:'Ticket promedio',v:ticket>0?fmtUSD(ticket):'—',s:'por oferta cumplida',hc:'#7c3aed',d:''}
];

var html='<div class="hero-grid">'+items.map(function(it){
return '<div class="hero-kpi" '+(it.id?('id="'+it.id+'"'):'' )+' style="--hc:'+it.hc+';'+(it.id?'cursor:pointer;':'')+'"><div class="hero-glow"></div>'+
'<div class="hero-label">'+it.l+'</div><div class="hero-val">'+it.v+'</div>'+
'<div class="hero-sub">'+it.s+(it.id?' · ▼':'')+'</div>'+it.d+'</div>';
}).join('')+'</div>';

document.getElementById('hero-kpis').innerHTML=html;

// click en cualquier parte de la card de revenue
var el=document.getElementById('hero-rev');
if(el){
el.onclick=function(){
var lines=[];
Object.keys(byTipo).sort().forEach(function(k){
var rv=byTipo[k].rev||0, c=byTipo[k].cum||0;
lines.push((k==='Desayuno'?'🍳':'🛏️')+' '+k+': '+fmtUSD(rv)+' · '+c+' ventas'+(c>0?' · ticket '+fmtUSD(rv/c):''));
});
openTipCustom('Revenue generado','Total: '+fmtUSD(totRev)+'\nVentas: '+totCum+'\nTicket prom.: '+(totCum>0?fmtUSD(ticket):'—')+'\n\nDetalle por tipo:\n'+(lines.length?lines.join('\n'):'—'));
};
}
}

// ─── GAUGE TABLE — CONVERSIÓN VS HOSTAL ──────────────────────────────────
var _gSort={col:'pct',asc:false};
function renderGauge(det){
var cerrados=det.filter(function(r){return r.cerrado&&r.conv_vs_hostal_pct!==null;});
var wrap=document.getElementById('gauge-sec');
if(!cerrados.length){
wrap.innerHTML='<div style="background:#fff;border-radius:14px;border:1.5px solid var(--border);padding:20px;font-size:12px;color:var(--gris);text-align:center;">⏳ Disponible solo para períodos cerrados. Filtra por un período cerrado para ver los datos.</div>';
return;
}
_gSort._data=cerrados;
_renderGaugeTable();
}
function _sortGauge(col){
if(_gSort.col===col)_gSort.asc=!_gSort.asc;
else{_gSort.col=col;_gSort.asc=col==='prop';}
_renderGaugeTable();
}
function _renderGaugeTable(){
var cerrados=_gSort._data||[];
var col=_gSort.col,asc=_gSort.asc;
var sorted=cerrados.slice().sort(function(a,b){
var va,vb;
if(col==='prop'){va=a.Propiedad;vb=b.Propiedad;return asc?va.localeCompare(vb):vb.localeCompare(va);}
if(col==='tipo'){va=a.tipo;vb=b.tipo;return asc?va.localeCompare(vb):vb.localeCompare(va);}
if(col==='pct'){va=a.conv_vs_hostal_pct||0;vb=b.conv_vs_hostal_pct||0;}
else if(col==='cum'){va=a.ofertas_cumplidas||0;vb=b.ofertas_cumplidas||0;}
else if(col==='den'){va=a.tipo==='Desayuno'?a._huespedes_hostal:a._checkins_hostal;vb=b.tipo==='Desayuno'?b._huespedes_hostal:b._checkins_hostal;}
else va=vb=0;
return asc?va-vb:vb-va;
});
var maxP=Math.max.apply(null,sorted.map(function(r){return r.conv_vs_hostal_pct||0;}));
function th(label,c,tip){
var ico=_gSort.col===c?(_gSort.asc?'↑':'↓'):'↕';
return '<th class="'+(c===_gSort.col?'sorted':'')+' " onclick="_sortGauge(\''+c+'\')">'+label+' <span class="sort-ico">'+ico+'</span>'+(tip?' <i class="ib" style="vertical-align:middle" onclick="event.stopPropagation();openTip(\''+tip+'\')\">">i</i>':'')+'</th>';
}
var html='<div class="gauge-table-wrap">'+
'<table class="gauge-table"><thead><tr>'+
th('Propiedad','prop','')+
th('Tipo','tipo','')+
th('Conv % vs hostal','pct','conv_hostal')+
th('Vendidas','cum','')+
th('Universo','den','')+
'<th>Período</th>'+
'</tr></thead><tbody>'+
sorted.map(function(r){
var pct=r.conv_vs_hostal_pct;
var col=colHostal(pct);
var fillW=Math.min(100,maxP>0?Math.round(pct/Math.max(maxP*1.1,0.0001)*100):0);
var esDes=r.tipo==='Desayuno';
var den=esDes?r._huespedes_hostal:r._checkins_hostal;
var denLabel=esDes?'hués.':'CI';
return '<tr>'+
'<td><div class="gt-prop">'+r.Propiedad.replace('Viajero ','').replace(' Hostel','').replace(' Hostal','')+'</div></td>'+
'<td><span class="gt-tipo-ico">'+(esDes?'🍳':'🛏️')+'</span> <span style="font-size:11px;font-weight:600">'+r.tipo+'</span></td>'+
'<td><div class="gt-bar-wrap"><div class="gt-bar-track"><div class="gt-bar-fill" style="width:'+fillW+'%;background:'+col+'"></div></div><span class="gt-pct" style="color:'+col+'">'+fmtFrac(pct,2)+'</span></div></td>'+
'<td class="gt-cum">'+r.ofertas_cumplidas+'</td>'+
'<td class="gt-denom">'+fmtN(den)+' '+denLabel+'</td>'+
'<td><span class="badge b-ok">'+r.Período+'</span></td>'+
'</tr>';
}).join('')+
'</tbody></table></div>'+
'<div style="font-size:10px;color:var(--gris);margin-top:9px;padding:7px 11px;background:var(--cm);border-radius:8px;">'+
'ℹ️ Clic en encabezado para ordenar. 🟢 ≥ 1% · 🟡 0.5-1% · 🔴 < 0.5% · Solo períodos cerrados · Denominadores desde <b>06_Kyto_Denominadores</b>'+
'</div>';
document.getElementById('gauge-sec').innerHTML=html;
}

// ─── TREND TABLE ────────────────────────────────────────────────────────────
function renderTrend(res){
var fp=getMsValues('per');
var rows=(fp.length?res.filter(function(r){return fp.includes(r.Período);}):res)
.slice().sort(function(a,b){return a.Período.localeCompare(b.Período);});
if(rows.length<2){document.getElementById('trend-sec').innerHTML='<div class="empty">Se necesitan al menos 2 períodos para mostrar tendencia.</div>';return;}
document.getElementById('trend-sec').innerHTML='<div class="trend-wrap"><table class="trend-table"><thead><tr>'+
'<th>Período</th><th>Enviadas</th><th>Cumplidas</th><th>Conv %</th><th>Revenue</th><th>Ticket prom.</th><th>Estado</th>'+
'</tr></thead><tbody>'+
rows.map(function(r,i){
var pv=rows[i-1];
function dlt(cur,pvV,fmt){
if(!pv||pvV==null)return '';
var d=cur-pvV;
if(Math.abs(d)<0.001)return '';
return ' <span class="'+(d>0?'delta-up':'delta-down')+'">'+(d>0?'↑':'↓')+' '+fmt(Math.abs(d))+'</span>';
}
return '<tr>'+
'<td><b>'+r.Período+'</b></td>'+
'<td>'+fmtN(r.ofertas_enviadas)+dlt(r.ofertas_enviadas,pv?pv.ofertas_enviadas:null,fmtN)+'</td>'+
'<td>'+fmtN(r.ofertas_cumplidas)+dlt(r.ofertas_cumplidas,pv?pv.ofertas_cumplidas:null,fmtN)+'</td>'+
'<td><b>'+fmtOferta(r.conv_oferta_pct)+'</b>'+dlt(r.conv_oferta_pct,pv?pv.conv_oferta_pct:null,function(x){return fmtOferta(x,2);})+'</td>'+
'<td>'+fmtUSD(r.revenue_usd)+dlt(r.revenue_usd,pv?pv.revenue_usd:null,fmtUSD)+'</td>'+
'<td>'+(r.ofertas_cumplidas>0?fmtUSD(r.revenue_usd/r.ofertas_cumplidas):'—')+'</td>'+
'<td><span class="badge '+(r.cerrado?'b-ok':'b-curso')+'">'+(r.cerrado?'✅ Cerrado':'⏳ En curso')+'</span></td>'+
'</tr>';
}).join('')+'</tbody></table></div>';
}

var tC=rows.reduce(function(s,r){return s+r.ofertas_cumplidas;},0);

var ico=conv>=0.12?'🟢':conv>=0.06?'🟡':'🔴';

var c=tr.reduce(function(s,r){return s+r.ofertas_cumplidas;},0);
var rv=tr.reduce(function(s,r){return s+r.revenue_usd;},0);
var cv=e>0?c/e:0;

var em=tr.reduce(function(s,r){return s+r.canal_email_cumplidas;},0);

?' · vs hostal: <b>'+fmtFrac(hc,2)+'</b>' // CORREGIDO
:'<span style="color:var(--warn)"> · vs hostal: mes en curso</span>';
return '<div class="tipo-card '+(tipo.toLowerCase())+'">'+
'<div class="tipo-hdr">'+
'<div class="tipo-name">'+(esDes?'🍳':'🛏️')+' '+tipo+'</div>'+

'</div>'+
'<div class="tipo-rev">'+fmtUSD(rv)+(c>0?' · '+fmtUSD(rv/c)+'/venta':'')+'</div>'+
'<div class="tipo-channel">'+
(wa>0?'<span class="tipo-ch ch-wa">📱 WA: '+wa+'</span>':'')+

(wa===0&&em===0&&c>0?'<span class="tipo-ch ch-sin">Canal desconocido</span>':'')+
'</div></div>';
}).join('');
return '<div class="prop-card" data-prop="'+prop+'">'+

'</div>'+

// ─── TIMING ─────────────────────────────────────────────────────────────────
function renderTiming(det){
var mD={},mU={};
det.forEach(function(r){
var m=r.tipo==='Desayuno'?mD:mU;
Object.entries(r.timing_dist||{}).forEach(function(e){m[e[0]]=(m[e[0]]||0)+e[1];});
});
var slots=[...new Set([...Object.keys(mD),...Object.keys(mU)])].sort(function(a,b){
var pn=function(s){var n=parseInt(s.slice(1));return s.includes('-')?-n:n;};
return pn(a)-pn(b);
});
if(!slots.length){document.getElementById('timing-sec').innerHTML='<div class="empty">Sin datos de timing.</div>';return;}
var maxV=Math.max(1,...slots.map(function(s){return Math.max(mD[s]||0,mU[s]||0);}));
var totBySlot=slots.map(function(s){return{s:s,n:(mD[s]||0)+(mU[s]||0)};}).sort(function(a,b){return b.n-a.n;});
var best=totBySlot[0]?totBySlot[0].s:null;
var slotsHtml='';
slotsHtml=slots.map(function(s){
var d=mD[s]||0,u=mU[s]||0;
var wD=maxV>0?Math.round(d/maxV*100):0;
var wU=maxV>0?Math.round(u/maxV*100):0;
var isBest=s===best;
var label=s==='T-0'?s+' (mismo día CI)':s==='T+1'?s+' (in-stay)':s;
return '<div class="t-slot">'+
'<div class="t-slot-lbl"><span class="t-slot-name">'+(isBest?'<b style="color:var(--ok)">'+label+'</b>':label)+'</span>'+
(isBest?'<span class="t-best-badge">★ mejor · '+(d+u)+' aceptaciones</span>':'<span class="t-slot-total">'+(d+u)+' aceptaciones</span>')+
'</div>'+
(d>0?'<div class="t-hbar-row"><span class="t-hbar-tipo">🍳 Desayuno</span><div class="t-hbar-track"><div class="t-hbar-fill" style="width:'+wD+'%;background:var(--ok)"></div></div><span class="t-hbar-val">'+d+'</span></div>':'')+
(u>0?'<div class="t-hbar-row"><span class="t-hbar-tipo">🛏️ Upgrade</span><div class="t-hbar-track"><div class="t-hbar-fill" style="width:'+wU+'%;background:var(--blue)"></div></div><span class="t-hbar-val">'+u+'</span></div>':'')+
'</div>';
}).join('<div class="t-divider"></div>');
document.getElementById('timing-sec').innerHTML=
'<div class="timing-wrap">'+
'<div class="t-header">'+
'<div><div class="t-title">Distribución de aceptaciones por franja</div>'+
'<div class="t-subtitle">Aceptaciones por <b>días vs check-in</b>: <b>T-</b> antes del check-in · <b>T+</b> ya hospedado</div></div>'+
(best?'<span class="t-best-badge">★ Franja líder: '+best+'</span>':'')+
'</div>'+
slotsHtml+
'<div class="t-legend">'+
'<span><div style="width:11px;height:11px;background:var(--ok);border-radius:3px"></div> Desayuno</span>'+
'<span><div style="width:11px;height:11px;background:var(--blue);border-radius:3px"></div> Upgrade</span>'+
'<span><b>Escala:</b> barras relativas al máximo del filtro actual (sirven para ver la franja líder)</span>'+
'</div></div>';
}

// ─── CANAL ──────────────────────────────────────────────────────────────────

var k=r.Propiedad+'||'+r.tipo;
if(!byK[k])byK[k]={prop:r.Propiedad,tipo:r.tipo,wa:0,em:0};
byK[k].wa+=r.canal_wa_cumplidas;byK[k].em+=r.canal_email_cumplidas;
});

'</tr></thead><tbody>'+
items.map(function(it){
var tot=it.wa+it.em||1;
var wP=Math.round(it.wa/tot*100),eP=100-wP;
return '<tr>'+
'<td><b>'+it.prop.replace('Viajero ','')+'</b><br><span style="font-size:10px;color:var(--gris)">'+it.tipo+'</span></td>'+
'<td style="min-width:120px">'+
'<div class="bar-duo"><div style="width:'+wP+'%;background:var(--ok);height:100%"></div><div style="width:'+eP+'%;background:var(--blue);height:100%"></div></div>'+
'<div style="display:flex;justify-content:space-between;font-size:9px;margin-top:3px;color:var(--gris)"><span>'+wP+'% WA</span><span>'+eP+'% Email</span></div>'+
'</td>'+
'<td style="text-align:center;font-size:17px;font-weight:800;color:var(--ok)">'+it.wa+'</td>'+
'<td style="text-align:center;font-size:17px;font-weight:800;color:var(--blue)">'+it.em+'</td>'+
'<td style="text-align:center"><span class="badge '+(it.wa>=it.em?'b-ok':'b-blue')+'">'+(it.wa>=it.em?'📱 WhatsApp':'📧 Email')+'</span></td>'+
'</tr>';
}).join('')+
'</tbody></table></div>'+
'<div style="font-size:10px;color:var(--gris);margin-top:8px;padding:7px 11px;background:var(--cm);border-radius:8px;">ℹ️ Solo conversiones con canal registrado.</div>';
}

function render(){
if(!DATA)return;
var det=filtrar(DATA.detalle||[]);
var res=DATA.resumen_por_periodo||[];
renderAlerts(det);renderHero(det,res);renderSynthesis(det,res);renderConclusiones(det,res);
renderGauge(det);renderRevenue(det);renderTrend(res);renderMetodo(res);
renderPropCards(det);renderTiming(det);renderCanal(det);
}

(async function(){
try{
var r=await fetch('../data/kyto_upselling.json?t='+Date.now());
DATA=await r.json();
if(DATA.actualizado){var dt=new Date(DATA.actualizado);var dStr=dt.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'});
var tStr=dt.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
document.getElementById('h-ts').textContent=dStr+' · '+tStr;}
poblarFiltros();render();
}catch(e){
document.getElementById('h-ts').textContent='Sin datos';
document.getElementById('synthesis-sec').innerHTML='<div class="alert-banner red"><div class="alert-ico">❌</div><div class="alert-text"><div class="alert-title">No se pudieron cargar los datos</div><div class="alert-desc">Verifica que <code>../data/kyto_upselling.json</code> existe y está accesible.</div></div></div>';
console.error(e);
}
})();
</script>
