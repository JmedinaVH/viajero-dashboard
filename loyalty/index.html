<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Viajero · Loyalty Dashboard</title>
<link rel="icon" type="image/png" href="../favicon-32x32.png"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
	--green:#065f46;--green-d:#044535;--green-soft:#d1fae5;--green-mid:#a7f3d0;
	--cream:#F4EFE9;--cm:#EDE5DA;--cd:#E0D5C8;--border:#DDD4CA;
	--dark:#1E100A;--mid:#6B3A28;--gris:#7A6E68;
	--ok:#15803d;--ok-bg:#dcfce7;
	--warn:#854d0e;--warn-bg:#fef9c3;
	--err:#dc2626;--err-bg:#fee2e2;
	--blue:#0369a1;--blue-bg:#e0f2fe;
	--purple:#7c3aed;--purple-bg:#ede9fe;
	--surface:#fff;
	--r:14px;--rl:18px;
	--sh:0 2px 8px rgba(30,16,10,.06),0 4px 20px rgba(30,16,10,.07);
	--shm:0 6px 28px rgba(30,16,10,.11);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Outfit',sans-serif;background:var(--cream);color:var(--dark);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:var(--cd);border-radius:9px;}
